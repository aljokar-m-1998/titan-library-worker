name: ingest Gutenberg texts into Titan-Library

# Every byte is fetched, cleaned, packaged and committed on GitHub's runner.
# Text + metadata + covers only; the EAD client narrates on device.
# One job, one writer: the gateway's library worker is off (see tts-switch.yml),
# so nothing else touches ledger.json or _worker/ while this runs.

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "books per commit this run"
        required: false
        default: "25"
      commit_files:
        description: "max files per commit (state rides along in the same commit)"
        required: false
        default: "1500"
      batches:
        description: "maximum commits this run may attempt"
        required: false
        default: "40"
      max_commits_per_run:
        description: "hard cap on commits, independent of batches"
        required: false
        default: "12"
      fetch_interval:
        description: "seconds between Project Gutenberg requests"
        required: false
        default: "1.0"
      max_minutes:
        description: "wall-clock limit for the ingest step"
        required: false
        default: "110"
      dry_run:
        description: "fetch and clean 3 books, commit nothing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # once a day, off the hour, so a run never shares a rate window with another writer
    - cron: "17 3 * * *"

concurrency:
  group: titan-library-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_LIBRARY_DATASET_REPO: ${{ vars.HF_LIBRARY_DATASET_REPO || 'M-hv1/Titan-Library' }}
      HF_LIBRARY_DATASET_REVISION: ${{ vars.HF_LIBRARY_DATASET_REVISION || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install only what the ingester needs
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir "huggingface_hub>=1.31,<2" "pyarrow>=15"

      - name: self-test the cleaner and the path guard (no network)
        run: python worker.py --self-test

      - name: prove the token and the dataset are readable
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_LIBRARY_DATASET_REPO"]
          info = api.repo_info(repo, repo_type="dataset")
          files = api.list_repo_files(repo, repo_type="dataset")
          print("dataset", info.id, "private", info.private, "sha", info.sha)
          print("files:", len(files), "| ledger.json present:", "ledger.json" in files)
          print("mp3 already on the shelf:", sum(f.endswith(".mp3") for f in files))
          PY

      - name: ingest
        run: |
          set +e
          python worker.py \
            --batch-size "${{ github.event.inputs.batch_size || (github.event_name == 'schedule' && '250' || '25') }}" \
            --commit-files "${{ github.event.inputs.commit_files || '1500' }}" \
            --batches "${{ github.event.inputs.batches || '40' }}" \
            --max-commits-per-run "${{ github.event.inputs.max_commits_per_run || vars.MAX_COMMITS_PER_RUN || '12' }}" \
            --fetch-interval "${{ github.event.inputs.fetch_interval || '1.0' }}" \
            --max-minutes "${{ github.event.inputs.max_minutes || '110' }}" \
            --reserve-minutes 12 --min-commit-interval 25 --min-remaining 150 \
            ${{ (github.event.inputs.dry_run == 'true' || (github.event_name == 'schedule' && vars.INGEST_DRY_RUN == 'true')) && '--dry-run' || '' }} \
            > ingest-run.json
          status=$?
          set -e
          cat ingest-run.json
          exit $status

      - name: independent remote verification of the last commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set +e
          python worker.py --verify-last > verify-run.json
          status=$?
          set -e
          cat verify-run.json
          exit $status

      - name: audit the public shelf without a token
        if: always()
        run: |
          set +e
          python - <<'PY' > shelf-audit.json
          import io, json, os, sys, urllib.request
          import pyarrow.parquet as pq
          import worker

          repo = os.environ["HF_LIBRARY_DATASET_REPO"]
          base = f"https://huggingface.co/datasets/{repo}/resolve/{os.environ['HF_LIBRARY_DATASET_REVISION']}/"
          problems = []

          def public(path):
              request = urllib.request.Request(base + path, headers=worker.UA)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return response.read()

          def want(ok, label, detail=""):
              print(("PASS " if ok else "FAIL ") + label + (f" {detail}" if detail else ""),
                    file=sys.stderr)
              if not ok:
                  problems.append(label)

          ledger = json.loads(public("ledger.json"))
          queue = ledger.get("queue") or []
          entries = [e for e in queue if e.get("source") == "gutendex"]
          want(bool(entries), "ledger.json is publicly readable", f"{len(entries)} gutendex entries")
          want(bool(ledger.get("updated_at")), "ledger.updated_at is present for the client's freshness check")

          # The client reads word counts from book.json chapters, never from ledger entries,
          # and the 63 gateway-era entries predate this writer. Hold the full contract only
          # against the books the index says this worker ingested.
          index = json.loads(public("_worker/library_index.json")).get("books") or {}
          written = {int(g) for g, m in index.items() if m.get("origin") == "catalog"}
          fresh = [e for e in entries if int(e.get("external_id") or 0) in written]
          legacy = [e for e in entries if int(e.get("external_id") or 0) not in written]
          want(bool(fresh), "the index identifies the ingested books",
               f"{len(fresh)} ingested, {len(legacy)} gateway-era")
          needed = {"key", "source", "external_id", "language", "title", "author", "cover",
                    "stage", "status", "chapters", "chapters_ready", "chars", "word_count"}
          absent = sorted({k for e in fresh for k in needed - set(e)})
          want(not absent, "every ingested entry carries the full ledger contract", ",".join(absent))
          identity = {"key", "source", "external_id", "language"}
          thin = sorted({k for e in entries for k in identity - set(e)})
          want(not thin, "every entry keeps its identity fields", ",".join(thin))
          print(f"INFO gateway-era entries lack {sorted({k for e in legacy for k in needed - set(e)})}",
                file=sys.stderr)
          want(not any(c in (e.get("title") or "") + (e.get("author") or "")
                       for e in entries for c in "\r\n"), "no raw control characters in titles")

          table = pq.read_table(io.BytesIO(public("catalog.parquet")))
          want(table.schema.names == worker.CATALOG_SCHEMA.names, "catalog schema matches the writer")
          want(table.num_rows == len(entries), "catalog rows equal ledger entries",
               f"{table.num_rows} vs {len(entries)}")

          ranked = sorted(entries, key=lambda e: int(e.get("rank") or 0), reverse=True)
          pick = next((e for e in ranked if e.get("cover")), None)
          want(pick is not None, "a recent book has a cover")
          if pick:
              gid = int(pick["external_id"])
              folder = worker.book_folder(gid)
              book = json.loads(public(f"{folder}/book.json"))
              chapters = book.get("chapters") or []
              want(book.get("external_id") == gid and book.get("language") == "en",
                   "book.json identity", f"{folder}")
              want(len(chapters) == int(pick.get("chapters") or 0),
                   "book.json chapters equal the ledger count", f"{len(chapters)}")
              want(all(int(c.get("word_count") or 0) > 0 for c in chapters),
                   "every chapter carries the word_count the client sums")
              first = public(f"{folder}/ch001_en.txt").decode("utf-8")
              want(bool(first.strip()) and "*** START" not in first and "*** END" not in first,
                   "first chapter is clean body text", f"{len(first)} chars")
              cover = public(f"{folder}/cover.jpg")
              want(cover[:3] == b"\xff\xd8\xff", "cover.jpg is a real JPEG served anonymously",
                   f"{len(cover)} bytes")
              want(book.get("audio_available") is False
                   and all(not c.get("audio_urls") for c in chapters),
                   "the new book references no audio")
          print(json.dumps({"audited_book": pick and pick.get("external_id"),
                            "ledger_entries": len(entries), "catalog_rows": table.num_rows,
                            "problems": problems}, indent=1))
          raise SystemExit(1 if problems else 0)
          PY
          status=$?
          set -e
          cat shelf-audit.json
          exit $status

      - name: upload this run's reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-run-${{ github.run_number }}
          path: |
            ingest-run.json
            verify-run.json
            shelf-audit.json
          if-no-files-found: ignore

      - name: show where the shelf stands
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from huggingface_hub import hf_hub_download
          from huggingface_hub.errors import EntryNotFoundError
          repo = os.environ["HF_LIBRARY_DATASET_REPO"]
          try:
              path = hf_hub_download(repo_id=repo, repo_type="dataset",
                                     filename="_worker/library_checkpoint.json",
                                     revision=os.environ["HF_LIBRARY_DATASET_REVISION"],
                                     token=os.environ["HF_TOKEN"])
          except EntryNotFoundError:
              print("no checkpoint yet: this run committed nothing (dry run or first run)")
              raise SystemExit(0)
          data = json.load(open(path, encoding="utf-8"))
          last = data.get("last_commit") or {}
          print(json.dumps({k: v for k, v in data.items() if k != "last_commit"}, indent=1))
          print("last commit:", last.get("commit", ""),
                "| files it expects:", len(last.get("expected") or {}))
          PY