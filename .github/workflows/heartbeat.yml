name: keep the shelf pumping

# GitHub documents scheduled workflows as best-effort. On 2026-11-16 three eligible
# ingest windows passed with zero `schedule` run records and zero progress on the
# dataset, with nothing in our configuration explaining it. This heartbeat asks one
# question an hour - has the shelf taken a commit lately, is a writer alive, is the
# worker parked? - and dispatches one ingest run when the shelf, not the clock, says so.
# It never fetches a book and never writes to the dataset itself.

on:
  workflow_dispatch:
    inputs:
      stale_minutes:
        description: "how long without a dataset commit counts as stalled"
        required: false
        default: "180"
      batch_size:
        description: "books per commit to hand the dispatched ingest run"
        required: false
        default: "100"
      state_only:
        description: "decide and report, dispatch nothing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # :27 so a heartbeat never shares a minute with the ingest cron at :17
    - cron: "27 * * * *"

concurrency:
  group: titan-library-heartbeat
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HF_DATASET: M-hv1/Titan-Library
      GH_REPO: ${{ github.repository }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STALE_MINUTES: ${{ github.event.inputs.stale_minutes || '180' }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '100' }}
      TARGET_BOOKS: ${{ vars.TARGET_BOOKS || '0' }}
      STATE_ONLY: ${{ github.event.inputs.state_only || 'false' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: decide from the dataset and the run queue
        run: |
          set +e
          python scripts/heartbeat.py > heartbeat.json
          status=$?
          set -e
          cat heartbeat.json
          exit $status

      - name: upload the verdict
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: heartbeat-${{ github.run_number }}
          path: heartbeat.json
          retention-days: 1
          if-no-files-found: error
